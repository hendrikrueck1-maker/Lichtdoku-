<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Lichtdoku</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0b0c10; --bg2:#12141a; --card-dark:#1a1d24; --card-dark2:#20242d; --border:#2b2f3a;
    --text:#f4f5f7; --muted:#8b92a3;
    --accent2:#6d5ef8; --accent2-dark:#5b4de0;
    --ok:#10b981; --danger:#ef4444;
    --kat-aufbau:#0ea5e9; --kat-einleuchten:#f5a524;
    --radius:16px; --radius-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  #app{min-height:100vh;padding-bottom:100px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius-sm);
    padding:11px 16px;font-size:15px;font-weight:600;background:var(--card-dark);color:var(--text);
    transition:transform .12s ease, opacity .12s ease, background .15s ease;}
  button:active{transform:scale(.96);opacity:.85;}
  input,textarea{font-family:inherit;font-size:16px;background:var(--card-dark);
    color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;width:100%;}
  textarea{resize:vertical;min-height:70px;}
  label{display:block;font-size:11px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}

  /* Top bar (scrollt normal mit, ist NICHT fixiert) */
  .topbar{background:var(--bg2);
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 14px 12px;
    border-bottom:1px solid var(--border);}
  .topbar h1{font-size:19px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .iconbtn{background:transparent;color:var(--text);padding:8px 10px;font-size:19px;border-radius:var(--radius-sm);}
  .tb-row{width:100%;display:flex;align-items:center;gap:8px;}
  .mode-toggle{display:flex;gap:4px;width:100%;background:var(--card-dark);border-radius:999px;padding:4px;}
  .mode-toggle button{flex:1;background:transparent;color:var(--muted);font-size:13px;padding:9px;
    border-radius:999px;}
  .mode-toggle button.active{background:var(--accent2);color:#fff;
    box-shadow:0 3px 10px rgba(109,94,248,.4);}

  .content{padding:14px 14px 100px;max-width:900px;margin:0 auto;}

  /* Home: show list */
  .show-item{background:var(--card-dark);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .show-item .meta{flex:1;min-width:0;}
  .show-item .name{font-size:16px;font-weight:700;}
  .show-item .count{font-size:12px;color:var(--muted);margin-top:3px;}
  .show-actions{display:flex;gap:6px;flex-shrink:0;}
  .btn-primary{background:var(--accent2);color:#fff;box-shadow:0 4px 14px rgba(109,94,248,.35);}
  .btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.35);}
  .btn-ok{background:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);}
  .empty-hint{color:var(--muted);text-align:center;padding:48px 20px;font-size:14px;line-height:1.6;}
  .fab-row{display:flex;gap:10px;margin-bottom:18px;}
  .fab-row button{flex:1;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar button{flex:1;min-width:110px;}

  .search-box{margin-bottom:14px;}
  .sticky-bar{position:sticky;top:0;z-index:15;background:var(--bg);
    margin:0 -14px 14px;padding:10px 14px;border-bottom:1px solid var(--border);}
  .cat-tabs{display:flex;gap:6px;background:var(--card-dark);border-radius:999px;padding:4px;}
  .cat-tabs button{flex:1;background:transparent;color:var(--muted);font-size:13px;padding:9px 6px;
    border-radius:999px;}
  .cat-tabs button.active{background:var(--accent2);color:#fff;box-shadow:0 3px 10px rgba(109,94,248,.4);}
  .cat-tabs button.active.kat-aufbau{background:var(--kat-aufbau);box-shadow:0 3px 10px rgba(14,165,233,.4);}
  .cat-tabs button.active.kat-einleuchten{background:var(--kat-einleuchten);box-shadow:0 3px 10px rgba(245,165,36,.4);}
  .sort-row{margin-bottom:14px;}
  .sort-row select{width:100%;}
  .section-head{padding:7px 14px;margin:4px 0 2px;border-radius:999px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;color:#fff;grid-column:1/-1;width:fit-content;}
  .section-head.kat-aufbau{background:var(--kat-aufbau);}
  .section-head.kat-einleuchten{background:var(--kat-einleuchten);}

  /* Floating Action Button: Neuer Kreis (nur im Bearbeitungsmodus) */
  .fab{position:fixed;right:calc(18px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
    background:var(--accent2);color:#fff;font-size:30px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(109,94,248,.5);z-index:40;}

  /* Card grid (overview) */
  .grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr;} }

  .card{background:#fdfdfd;color:#111;border:1px solid #e2e2e2;border-left:6px solid transparent;
    border-radius:14px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);}
  .card.kat-aufbau{border-left-color:var(--kat-aufbau);}
  .card.kat-einleuchten{border-left-color:var(--kat-einleuchten);}
  .cat-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;
    padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;z-index:3;font-weight:700;}
  .cat-badge.kat-aufbau{background:var(--kat-aufbau);}
  .cat-badge.kat-einleuchten{background:var(--kat-einleuchten);}
  .card-images{display:flex;flex-direction:column;}
  .img-wrap{width:100%;margin:0 auto;aspect-ratio:1/1;background:#e8e8e8;display:flex;align-items:center;justify-content:center;
    border-top:1px solid #ccc;overflow:hidden;position:relative;}
  .card-images.count-1 .img-wrap{width:min(100%, 58vh);}
  .card-images.count-2 .img-wrap{width:min(100%, 38vh);}
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-del{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;border:none;
    border-radius:50%;width:32px;height:32px;font-size:15px;z-index:4;padding:0;line-height:1;}
  .card-footer{width:100%;border-collapse:collapse;font-size:12px;border-top:1px solid #e2e2e2;}
  .card-footer td{border:1px solid #eee;padding:8px 9px;vertical-align:top;}
  .card-footer td b{display:block;font-size:10px;color:#8a8a8a;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;font-weight:700;}
  .card-editrow{display:flex;gap:6px;padding:10px;background:#f4f4f4;}
  .card-editrow button{flex:1;font-size:12.5px;padding:9px 6px;border-radius:10px;}

  /* Entry form */
  .photo-btns{display:flex;gap:10px;}
  .photo-slot{flex:1;text-align:center;}
  .photo-slot .preview{width:100%;aspect-ratio:1/1;background:var(--card-dark);border:1px dashed var(--border);
    border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    margin-bottom:6px;position:relative;}
  .photo-slot .preview img{width:100%;height:100%;object-fit:cover;}
  .photo-slot .preview .plus{font-size:34px;color:var(--muted);}
  .photo-slot .preview .plus-hint{font-size:11px;color:var(--muted);margin-top:-4px;}
  .photo-slot-btns{display:flex;flex-direction:column;gap:6px;}
  .photo-slot-btns button{width:100%;font-size:13px;padding:9px;}
  .cam-live-btn{background:transparent;border:1px dashed var(--border);color:var(--muted);
    font-size:12px !important;padding:6px !important;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;}
  .tag{background:var(--card-dark);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;font-size:13px;color:var(--text);font-weight:500;}
  .cat-choice{flex:1;text-align:center;border-radius:999px;}
  .cat-choice.active.kat-aufbau{background:var(--kat-aufbau);color:#fff;border-color:transparent;}
  .cat-choice.active.kat-einleuchten{background:var(--kat-einleuchten);color:#fff;border-color:transparent;}
  .form-actions{display:flex;gap:10px;margin-top:24px;}
  .form-actions button{flex:1;padding:14px;font-size:16px;}

  .hidden{display:none !important;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* Update-Banner (Versionsprüfung) */
  .update-banner{position:fixed;top:0;left:0;right:0;z-index:500;background:var(--accent2);color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));font-size:13px;font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,.35);}
  .update-banner.hidden{display:none;}
  .update-banner .ub-text{flex:1;min-width:0;}
  .update-banner button{padding:7px 13px;font-size:12.5px;background:rgba(255,255,255,.22);color:#fff;flex-shrink:0;}
  .update-dismiss{background:transparent !important;padding:6px 8px !important;font-size:15px !important;}
  .version-tag{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;padding-bottom:10px;}

  /* Zoom-Lightbox für Fotos */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:250;
    display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;}
  .lightbox.hidden{display:none;}
  .lightbox img{max-width:100vw;max-height:100vh;touch-action:none;user-select:none;
    -webkit-user-drag:none;transform-origin:0 0;}
  .lb-close{position:absolute;top:14px;right:16px;color:#fff;font-size:24px;z-index:6;
    padding:8px 14px;background:rgba(255,255,255,.14);border-radius:50%;line-height:1;}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);
    color:#fff;border:none;font-size:32px;width:50px;height:64px;border-radius:10px;z-index:6;
    line-height:1;padding:0;}
  .lb-prev{left:8px;} .lb-next{right:8px;}
  .lb-info{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));font-size:13px;text-align:center;z-index:5;}
  .lb-info b{color:#ffcf7d;}
  .lb-info .lb-sub{opacity:.75;font-size:11px;margin-top:2px;}

  /* Live-Kamera mit 1:1-Vorschau */
  .camera-overlay{position:fixed;inset:0;background:#000;z-index:300;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
  .camera-overlay.hidden{display:none;}
  .camera-overlay video{width:min(88vw,60vh);aspect-ratio:1/1;object-fit:cover;
    border:2px solid #fff;border-radius:8px;background:#111;}
  .camera-hint{color:#ccc;font-size:12px;text-align:center;}
  .camera-controls{display:flex;align-items:center;gap:24px;}
  .cam-shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #999;
    font-size:0;padding:0;}
  .cam-cancel,.cam-switch{background:transparent;color:#fff;border:1px solid #666;
    padding:8px 14px;border-radius:20px;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileInput1" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileInput2" accept="image/*" capture="environment" class="hidden">
<input type="file" id="jsonImportInput" accept="application/json" class="hidden">
<div id="toast" class="toast"></div>

<div id="updateBanner" class="update-banner hidden">
  <span class="ub-text">Update verfügbar<span id="updateVersionLabel"></span></span>
  <button onclick="applyUpdate()">Aktualisieren</button>
  <button class="update-dismiss" onclick="dismissUpdateBanner()">✕</button>
</div>

<div id="cameraOverlay" class="camera-overlay hidden">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="camera-hint">Motiv im Quadrat positionieren</div>
  <div class="camera-controls">
    <button class="cam-cancel" onclick="closeCamera()">✕ Abbrechen</button>
    <button class="cam-shutter" onclick="captureFromCamera()">⚪</button>
    <button class="cam-switch" onclick="switchCamera()">🔄</button>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <img id="lightboxImg" src="" draggable="false">
  <div id="lbInfo" class="lb-info"></div>
</div>

<script>
/* ===================== Version & Updates ===================== */
const APP_VERSION = '1.4.0';

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

async function checkForUpdate(manual){
  try{
    const res = await fetch('./version.json', {cache:'no-store'});
    const data = await res.json();
    if(data.version && data.version !== APP_VERSION){
      showUpdateBanner(data.version);
      if(manual) toast('Update gefunden: v'+data.version);
    } else if(manual){
      toast('Du nutzt bereits die aktuelle Version (v'+APP_VERSION+')');
    }
  }catch(err){
    if(manual) toast('Update-Prüfung fehlgeschlagen (offline?)');
  }
}
function showUpdateBanner(newVersion){
  byId('updateVersionLabel').textContent = ' (v'+newVersion+')';
  byId('updateBanner').classList.remove('hidden');
}
function dismissUpdateBanner(){
  byId('updateBanner').classList.add('hidden');
}
async function applyUpdate(){
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.unregister(); }
    }
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(err){}
  location.href = location.pathname + '?_=' + Date.now();
}
function initVersionCheck(){
  checkForUpdate(false);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') checkForUpdate(false);
  });
}

/* ===================== Datenhaltung ===================== */
/* Ab v1.3.0: Ablage in IndexedDB statt localStorage. localStorage ist auf
   ca. 5–10 MB pro App begrenzt und lief durch die Fotos (Base64) schnell voll
   ("Speichern fehlgeschlagen"). IndexedDB hat ein vielfaches Limit (i.d.R.
   ein Anteil des freien Gerätespeichers), damit passt deutlich mehr rein,
   ohne dass alte Fotos gelöscht werden müssen.
   Für alle bestehenden Aufrufstellen im Code bleibt loadShows()/loadEntries()
   SYNCHRON nutzbar: Beim Start wird einmalig alles aus IndexedDB (bzw. beim
   allerersten Start aus einem evtl. vorhandenen alten localStorage-Bestand)
   in einen In-Memory-Cache geladen. saveShows()/saveEntries() aktualisieren
   den Cache sofort und schreiben asynchron im Hintergrund nach IndexedDB. */
const IDB_NAME = 'lichtdoku_db';
const IDB_STORE = 'kv';
let idbHandle = null;
let storageCache = { shows: [], entries: {} };
let storageReady = false;

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(idbHandle){ resolve(idbHandle); return; }
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB nicht verfügbar')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{ idbHandle = req.result; resolve(idbHandle); };
    req.onerror = ()=> reject(req.error);
  });
}
function idbGetAll(){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const store = tx.objectStore(IDB_STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    tx.oncomplete = ()=> resolve({keys:keysReq.result, vals:valsReq.result});
    tx.onerror = ()=> reject(tx.error);
  }));
}
function idbPut(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  }));
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}

/* Einmalige Migration: alte localStorage-Daten (falls vorhanden) in
   IndexedDB übernehmen und danach aus localStorage entfernen, damit der
   knappe localStorage-Speicher wieder frei wird. Kein Datenverlust, kein
   manuelles Löschen alter Fotos nötig. */
async function migrateFromLocalStorageIfNeeded(){
  try{
    const oldShows = localStorage.getItem('ld_shows');
    if(oldShows !== null){
      await idbPut('ld_shows', JSON.parse(oldShows));
      localStorage.removeItem('ld_shows');
    }
    const oldKeys = Object.keys(localStorage).filter(k=>k.indexOf('ld_entries_') === 0);
    for(const k of oldKeys){
      try{ await idbPut(k, JSON.parse(localStorage.getItem(k))); }catch(e){}
      localStorage.removeItem(k);
    }
  }catch(err){ console.error('Migration von localStorage fehlgeschlagen', err); }
}

async function initStorage(){
  try{
    await migrateFromLocalStorageIfNeeded();
    const {keys, vals} = await idbGetAll();
    let shows = [];
    const entries = {};
    keys.forEach((k, i)=>{
      if(k === 'ld_shows'){ shows = vals[i] || []; }
      else if(typeof k === 'string' && k.indexOf('ld_entries_') === 0){
        entries[k.slice('ld_entries_'.length)] = vals[i] || [];
      }
    });
    storageCache = { shows, entries };
  }catch(err){
    console.error('IndexedDB-Init fehlgeschlagen, Fallback auf localStorage', err);
    try{ storageCache.shows = JSON.parse(localStorage.getItem('ld_shows')||'[]'); }catch(e){}
  }
  storageReady = true;
}

function loadShows(){ return storageCache.shows; }
function saveShows(s){
  storageCache.shows = s;
  idbPut('ld_shows', s).catch(err=>{
    console.error('saveShows failed', err);
    toast('⚠️ Speichern fehlgeschlagen. Bitte Backup (JSON) sichern.');
  });
  return true;
}
function loadEntries(showId){ return storageCache.entries[showId] || []; }
function saveEntries(showId, e){
  storageCache.entries[showId] = e;
  idbPut('ld_entries_'+showId, e).catch(err=>{
    console.error('saveEntries failed', err);
    toast('⚠️ Speichern fehlgeschlagen. Bitte Backup (JSON) sichern.');
  });
  return true;
}

/* ===================== Google Drive Sync (ab v1.4.0) ===================== */
/* Jede Veranstaltung wird als eigene Datei "<showId>.json" (Show + Einträge,
   inkl. Fotos als Base64) in einem App-eigenen Drive-Ordner abgelegt.
   Ablauf: lokale Änderung -> nach kurzer Pause automatischer Upload, sofern
   online & verbunden. Beim App-Start, beim Öffnen einer Show und sobald die
   Internetverbindung wiederkommt, wird zusätzlich automatisch geprüft, ob auf
   Drive neuere Stände liegen (von einem anderen Gerät) und lädt diese herunter.
   Scope "drive.file": die App sieht NUR den von ihr selbst angelegten Ordner,
   nicht das restliche Drive-Konto. Es wird kein Client-Secret verwendet (im
   Browser nicht nötig und nicht sicher speicherbar) – nur die Client-ID. */
const DRIVE_CLIENT_ID = '366571690468-uc0a00bl4hn144tqlh5bsm064qikmd91.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'Lichtdoku Sync';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3';

let driveSync = {
  tokenClient: null,
  accessToken: null,
  tokenExpiresAt: 0,
  folderId: null,
  connected: false,
  syncing: false,
  dirty: new Set(),
  syncTimer: null,
  lastSyncAt: null
};

async function loadDriveSettings(){
  try{
    const s = await idbGet('ld_drive_settings');
    if(s){ driveSync.folderId = s.folderId || null; driveSync.connected = !!s.connected; }
  }catch(e){}
  try{
    const pending = await idbGet('ld_drive_pending');
    if(Array.isArray(pending)) driveSync.dirty = new Set(pending);
  }catch(e){}
}
function saveDriveSettings(){
  idbPut('ld_drive_settings', { folderId: driveSync.folderId, connected: driveSync.connected }).catch(()=>{});
}
function persistDirtySet(){
  idbPut('ld_drive_pending', Array.from(driveSync.dirty)).catch(()=>{});
}

async function initDriveSync(){
  await loadDriveSettings();
  if(driveSync.connected && driveSync.folderId){
    setupTokenClient();
    if(navigator.onLine){
      try{ await requestDriveToken(true); await flushPendingSync(); await pullAllShows(); }
      catch(err){ /* still keine aktive Google-Sitzung -> Symbol zeigt "bitte antippen" */ }
    }
  }
  window.addEventListener('online', ()=>{
    if(!driveSync.connected) return;
    requestDriveToken(true).then(()=>{ flushPendingSync(); pullAllShows(); }).catch(()=>{});
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && driveSync.connected && navigator.onLine){
      requestDriveToken(true).then(()=> pullAllShows()).catch(()=>{});
    }
  });
  renderApp();
}

function setupTokenClient(){
  if(driveSync.tokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return;
  driveSync.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, callback: ()=>{}
  });
}
function requestDriveToken(silent){
  return new Promise((resolve, reject)=>{
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      reject(new Error('Google-Bibliothek noch nicht geladen')); return;
    }
    setupTokenClient();
    if(driveSync.accessToken && Date.now() < driveSync.tokenExpiresAt - 30000){
      resolve(driveSync.accessToken); return;
    }
    driveSync.tokenClient.callback = (resp)=>{
      if(!resp || resp.error){ reject(new Error((resp&&resp.error)||'Token-Fehler')); return; }
      driveSync.accessToken = resp.access_token;
      driveSync.tokenExpiresAt = Date.now() + (resp.expires_in||3600)*1000;
      resolve(driveSync.accessToken);
    };
    try{ driveSync.tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' }); }
    catch(err){ reject(err); }
  });
}

async function ensureDriveFolder(){
  if(driveSync.folderId) return driveSync.folderId;
  const token = await requestDriveToken(true);
  const q = encodeURIComponent("name='"+DRIVE_FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const res = await fetch(DRIVE_API+'/files?q='+q+'&fields=files(id,name)', { headers:{ Authorization:'Bearer '+token } });
  const data = await res.json();
  if(data.files && data.files.length){
    driveSync.folderId = data.files[0].id;
  } else {
    const createRes = await fetch(DRIVE_API+'/files', {
      method:'POST',
      headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify({ name:DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
    });
    const created = await createRes.json();
    driveSync.folderId = created.id;
  }
  saveDriveSettings();
  return driveSync.folderId;
}

async function connectDriveFlow(){
  try{
    await requestDriveToken(false);
    toast('Verbunden – richte Ordner ein…');
    await ensureDriveFolder();
    driveSync.connected = true;
    saveDriveSettings();
    toast('☁️ Drive verbunden ("'+DRIVE_FOLDER_NAME+'")');
    await pullAllShows();
    await flushPendingSync();
  }catch(err){
    console.error(err);
    toast('Drive-Verbindung fehlgeschlagen oder abgebrochen');
  }
  renderApp();
}
function disconnectDrive(){
  if(!confirm('Drive-Sync trennen? Deine lokalen Dokumentationen bleiben auf diesem Gerät erhalten, werden aber nicht mehr automatisch gesichert.')) return;
  driveSync.connected = false;
  driveSync.accessToken = null;
  driveSync.tokenExpiresAt = 0;
  saveDriveSettings();
  toast('Drive-Sync getrennt');
  renderApp();
}

function markShowDirty(showId){
  if(!showId || !driveSync.connected) return;
  driveSync.dirty.add(showId);
  persistDirtySet();
  clearTimeout(driveSync.syncTimer);
  driveSync.syncTimer = setTimeout(flushPendingSync, 2000);
  renderApp();
}

async function flushPendingSync(){
  if(!driveSync.connected || !navigator.onLine || driveSync.dirty.size === 0) return;
  driveSync.syncing = true; renderApp();
  let token;
  try{ token = await requestDriveToken(true); }
  catch(err){ driveSync.syncing = false; renderApp(); return; }
  const ids = Array.from(driveSync.dirty);
  for(const id of ids){
    try{ await uploadShowToDrive(id, token); driveSync.dirty.delete(id); persistDirtySet(); }
    catch(err){ console.error('Sync fehlgeschlagen für', id, err); }
  }
  driveSync.syncing = false;
  driveSync.lastSyncAt = Date.now();
  renderApp();
}

async function uploadShowToDrive(showId, token){
  const shows = loadShows();
  const show = shows.find(s=>s.id===showId);
  if(!show) return;
  const entries = loadEntries(showId);
  token = token || await requestDriveToken(true);
  const folderId = await ensureDriveFolder();
  const fileName = showId + '.json';
  let fileId = show.driveFileId;
  if(!fileId){
    const q = encodeURIComponent("name='"+fileName+"' and '"+folderId+"' in parents and trashed=false");
    const searchRes = await fetch(DRIVE_API+'/files?q='+q+'&fields=files(id)', { headers:{ Authorization:'Bearer '+token } });
    const searchData = await searchRes.json();
    if(searchData.files && searchData.files.length) fileId = searchData.files[0].id;
  }
  const metadata = fileId ? {} : { name:fileName, parents:[folderId] };
  const initUrl = fileId
    ? DRIVE_UPLOAD_API+'/files/'+fileId+'?uploadType=resumable'
    : DRIVE_UPLOAD_API+'/files?uploadType=resumable';
  const initRes = await fetch(initUrl, {
    method: fileId ? 'PATCH' : 'POST',
    headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json; charset=UTF-8' },
    body: JSON.stringify(metadata)
  });
  if(!initRes.ok) throw new Error('Drive-Upload-Init fehlgeschlagen: '+initRes.status);
  const uploadUrl = initRes.headers.get('Location');
  const payload = JSON.stringify({ show, entries, syncedAt:Date.now() });
  const putRes = await fetch(uploadUrl, { method:'PUT', headers:{ 'Content-Type':'application/json' }, body: payload });
  if(!putRes.ok) throw new Error('Drive-Upload fehlgeschlagen: '+putRes.status);
  const putData = await putRes.json();
  const shows2 = loadShows();
  const idx = shows2.findIndex(s=>s.id===showId);
  if(idx>=0){
    shows2[idx].driveFileId = putData.id;
    shows2[idx].driveKnownModified = Date.now();
    saveShows(shows2);
  }
}

async function deleteDriveFile(fileId){
  try{
    const token = await requestDriveToken(true);
    await fetch(DRIVE_API+'/files/'+fileId, { method:'DELETE', headers:{ Authorization:'Bearer '+token } });
  }catch(err){ /* best effort */ }
}

async function pullAllShows(){
  if(!driveSync.connected || !navigator.onLine) return;
  try{
    const token = await requestDriveToken(true);
    const folderId = await ensureDriveFolder();
    const q = encodeURIComponent("'"+folderId+"' in parents and trashed=false and name contains '.json'");
    const res = await fetch(DRIVE_API+'/files?q='+q+'&fields=files(id,name,modifiedTime)&pageSize=1000', { headers:{ Authorization:'Bearer '+token } });
    const data = await res.json();
    const files = data.files || [];
    for(const f of files){ await pullOneFile(f, token); }
    renderApp();
  }catch(err){ console.error('Drive-Abgleich fehlgeschlagen', err); }
}

async function pullOneFile(f, token){
  const showId = f.name.replace(/\.json$/,'');
  if(driveSync.dirty.has(showId)) return; // lokale Änderung wartet noch auf Upload -> nicht überschreiben
  const shows = loadShows();
  const localShow = shows.find(s=>s.id===showId);
  const remoteTime = new Date(f.modifiedTime).getTime();
  if(localShow && localShow.driveKnownModified && remoteTime <= localShow.driveKnownModified) return;
  try{
    const res = await fetch(DRIVE_API+'/files/'+f.id+'?alt=media', { headers:{ Authorization:'Bearer '+token } });
    if(!res.ok) return;
    const payload = await res.json();
    if(!payload.show || !payload.entries) return;
    const shows2 = loadShows();
    const idx = shows2.findIndex(s=>s.id===showId);
    const mergedShow = Object.assign({}, payload.show, { id:showId, driveFileId:f.id, driveKnownModified:remoteTime });
    if(idx>=0) shows2[idx] = mergedShow; else shows2.push(mergedShow);
    saveShows(shows2);
    saveEntries(showId, payload.entries);
  }catch(err){ console.error('Pull fehlgeschlagen für', showId, err); }
}

/* ===================== Bildkompression ===================== */
/* Jedes Foto wird unabhängig von Hoch-/Querformat mittig auf ein 1:1-Quadrat
   zugeschnitten und dann komprimiert. So sind alle Bilder in Vorschau, Karten
   und PDF-Export immer gleich groß und unverzerrt – egal wie fotografiert wurde. */
async function compressImage(file, targetSize=1300, quality=0.8){
  let bitmap = null;
  try{ bitmap = await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){ bitmap = null; }
  if(!bitmap){
    // Fallback ohne EXIF-Korrektur
    const dataUrl = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ev => res(ev.target.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const img = await new Promise((res,rej)=>{
      const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src = dataUrl;
    });
    const out = cropToSquare(img, img.width, img.height, targetSize, quality);
    return out;
  }
  const out = cropToSquare(bitmap, bitmap.width, bitmap.height, targetSize, quality);
  bitmap.close && bitmap.close();
  return out;
}
function cropToSquare(source, w, h, targetSize, quality){
  const side = Math.min(w, h);
  const sx = (w - side) / 2;
  const sy = (h - side) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = targetSize; canvas.height = targetSize;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(source, sx, sy, side, side, 0, 0, targetSize, targetSize);
  return canvas.toDataURL('image/jpeg', quality);
}

/* ===================== Live-Kamera (1:1-Vorschau, optional) ===================== */
/* Zeigt einen quadratischen Live-Sucher (object-fit:cover) – was zu sehen ist,
   entspricht exakt dem späteren 1:1-Zuschnitt. Das ist eine ZUSÄTZLICHE Option:
   der normale "📷 Foto"-Button (nativer Kamera-Dialog des Geräts) ist immer
   verfügbar und zuverlässig. Wichtig: Wir lösen bei Fehlschlag NIE automatisch
   einen Klick auf den Datei-Dialog aus – das führt in Safari/iOS dazu, dass der
   Dialog lautlos blockiert wird, weil die "User-Geste" nach einem await bereits
   verfallen ist. Stattdessen gibt es eine klare Meldung. */
async function openCamera(slot){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    toast('Live-Kamera hier nicht verfügbar – bitte „📷 Foto“ nutzen');
    return;
  }
  cameraState.slot = slot;
  try{
    await startStream();
    byId('cameraOverlay').classList.remove('hidden');
  }catch(err){
    toast('Live-Kamera nicht verfügbar – bitte „📷 Foto“ nutzen');
  }
}
async function startStream(){
  if(cameraState.stream){ cameraState.stream.getTracks().forEach(t=>t.stop()); }
  cameraState.stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal: cameraState.facing } }, audio:false
  });
  const video = byId('cameraVideo');
  video.srcObject = cameraState.stream;
  try{ await video.play(); }catch(e){}
}
async function switchCamera(){
  cameraState.facing = cameraState.facing === 'environment' ? 'user' : 'environment';
  try{ await startStream(); }catch(e){ toast('Kamerawechsel nicht möglich'); }
}
function closeCamera(){
  if(cameraState.stream){ cameraState.stream.getTracks().forEach(t=>t.stop()); cameraState.stream=null; }
  byId('cameraOverlay').classList.add('hidden');
  cameraState.slot = null;
}
function captureFromCamera(){
  const video = byId('cameraVideo');
  if(!video.videoWidth){ toast('Kamera lädt noch…'); return; }
  const dataUrl = cropToSquare(video, video.videoWidth, video.videoHeight, 1300, 0.8);
  if(cameraState.slot === 1) tempImages.bild1 = dataUrl;
  else if(cameraState.slot === 2) tempImages.bild2 = dataUrl;
  closeCamera();
  renderApp();
}

/* ===================== Zoom-Lightbox mit Galerie ===================== */
let lb = { scale:1, x:0, y:0, lastTap:0 };
let lbPointers = new Map();
let lbPinchStartDist = 0, lbPinchStartScale = 1, lbPanStart = null, lbSwipeStart = null;
let currentGallery = [];
let currentGalleryIndex = 0;

/* Baut die Bilder-Galerie aus genau den Einträgen, die aktuell in der
   Übersicht sichtbar sind (gleicher Filter/Suche/Sortierung) – so führt
   "weiter/zurück" durch exakt das, was man gerade sieht. */
function getVisibleEntries(show){
  let entries = loadEntries(show.id);
  if(state.categoryFilter && state.categoryFilter !== 'Alle'){
    entries = entries.filter(e => (e.kategorie || 'Einleuchten') === state.categoryFilter);
  }
  const q = state.search.trim().toLowerCase();
  if(q){
    entries = entries.filter(e =>
      (e.kreis||'').toLowerCase().includes(q) ||
      (e.filter||'').toLowerCase().includes(q) ||
      (e.adresse||'').toLowerCase().includes(q) ||
      (e.bemerkung||'').toLowerCase().includes(q) ||
      (e.gruppe||'').toLowerCase().includes(q)
    );
  }
  return sortEntries(entries);
}
function getGalleryForShow(show){
  const entries = getVisibleEntries(show);
  let gallery = [];
  entries.forEach(e=>{
    const total = (e.bild1?1:0) + (e.bild2?1:0);
    let n = 0;
    if(e.bild1){ n++; gallery.push({src:e.bild1, entryId:e.id, slot:1, n:n, total:total,
      kreis:e.kreis, filter:e.filter, adresse:e.adresse, bemerkung:e.bemerkung}); }
    if(e.bild2){ n++; gallery.push({src:e.bild2, entryId:e.id, slot:2, n:n, total:total,
      kreis:e.kreis, filter:e.filter, adresse:e.adresse, bemerkung:e.bemerkung}); }
  });
  return gallery;
}
function openGalleryLightbox(entryId, slot){
  const show = loadShows().find(s=>s.id===state.showId);
  if(!show) return;
  const gallery = getGalleryForShow(show);
  const idx = gallery.findIndex(g=>g.entryId===entryId && g.slot===slot);
  if(idx < 0) return;
  currentGallery = gallery;
  showGalleryAt(idx);
}
function showGalleryAt(idx){
  if(idx < 0 || idx >= currentGallery.length) return;
  currentGalleryIndex = idx;
  const item = currentGallery[idx];
  lb.scale = 1; lb.x = 0; lb.y = 0;
  applyLbTransform();
  byId('lightboxImg').src = item.src;
  renderLbInfo(item);
  byId('lightbox').classList.remove('hidden');
  updateLbNavVisibility();
}
function renderLbInfo(item){
  let html = '<div>Kreis: <b>'+escapeHtml(item.kreis||'–')+'</b> · Filter: <b>'+escapeHtml(item.filter||'–')+'</b></div>';
  if(item.adresse){ html += '<div class="lb-sub">Adresse: '+escapeHtml(item.adresse)+'</div>'; }
  if(item.bemerkung){ html += '<div class="lb-sub">'+escapeHtml(item.bemerkung)+'</div>'; }
  html += '<div class="lb-sub">Bild '+item.n+' von '+item.total+'</div>';
  byId('lbInfo').innerHTML = html;
}
function updateLbNavVisibility(){
  const box = byId('lightbox');
  box.querySelector('.lb-prev').style.visibility = currentGalleryIndex > 0 ? 'visible' : 'hidden';
  box.querySelector('.lb-next').style.visibility = currentGalleryIndex < currentGallery.length-1 ? 'visible' : 'hidden';
}
function lbNav(dir){
  const newIdx = currentGalleryIndex + dir;
  if(newIdx < 0 || newIdx >= currentGallery.length) return;
  showGalleryAt(newIdx);
}
function openLightboxSingle(src){
  if(!src) return;
  currentGallery = []; currentGalleryIndex = 0;
  lb.scale = 1; lb.x = 0; lb.y = 0;
  applyLbTransform();
  byId('lightboxImg').src = src;
  byId('lbInfo').innerHTML = '';
  byId('lightbox').classList.remove('hidden');
  const box = byId('lightbox');
  box.querySelector('.lb-prev').style.visibility = 'hidden';
  box.querySelector('.lb-next').style.visibility = 'hidden';
}
function closeLightbox(){
  byId('lightbox').classList.add('hidden');
  byId('lightboxImg').src = '';
  currentGallery = []; currentGalleryIndex = 0;
}
function applyLbTransform(){
  byId('lightboxImg').style.transform = 'translate('+lb.x+'px,'+lb.y+'px) scale('+lb.scale+')';
}
function lbDist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function initLightbox(){
  const box = byId('lightbox');
  const img = byId('lightboxImg');
  box.addEventListener('click', e=>{ if(e.target.id === 'lightbox') closeLightbox(); });
  img.addEventListener('pointerdown', e=>{
    img.setPointerCapture(e.pointerId);
    lbPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(lbPointers.size === 1){
      lbPanStart = {x:e.clientX - lb.x, y:e.clientY - lb.y};
      lbSwipeStart = {x:e.clientX, y:e.clientY};
      const now = Date.now();
      if(now - lb.lastTap < 300){
        lb.scale = lb.scale > 1 ? 1 : 2.5;
        lb.x = 0; lb.y = 0;
        applyLbTransform();
      }
      lb.lastTap = now;
    } else if(lbPointers.size === 2){
      const pts = [...lbPointers.values()];
      lbPinchStartDist = lbDist(pts[0], pts[1]);
      lbPinchStartScale = lb.scale;
    }
  });
  img.addEventListener('pointermove', e=>{
    if(!lbPointers.has(e.pointerId)) return;
    lbPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(lbPointers.size === 2 && lbPinchStartDist){
      const pts = [...lbPointers.values()];
      const d = lbDist(pts[0], pts[1]);
      lb.scale = Math.min(5, Math.max(1, lbPinchStartScale * d / lbPinchStartDist));
      applyLbTransform();
    } else if(lbPointers.size === 1 && lb.scale > 1 && lbPanStart){
      lb.x = e.clientX - lbPanStart.x;
      lb.y = e.clientY - lbPanStart.y;
      applyLbTransform();
    }
  });
  const onPointerUp = e=>{
    const wasSingle = lbPointers.size === 1;
    if(wasSingle && lb.scale <= 1 && lbSwipeStart){
      const dx = e.clientX - lbSwipeStart.x;
      const dy = e.clientY - lbSwipeStart.y;
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
        lbNav(dx < 0 ? 1 : -1);
      }
    }
    lbSwipeStart = null;
    lbPointers.delete(e.pointerId);
    if(lbPointers.size < 2) lbPinchStartDist = 0;
  };
  const onPointerCancel = e=>{
    lbSwipeStart = null;
    lbPointers.delete(e.pointerId);
    if(lbPointers.size < 2) lbPinchStartDist = 0;
  };
  img.addEventListener('pointerup', onPointerUp);
  img.addEventListener('pointercancel', onPointerCancel);
}

/* ===================== Helpers ===================== */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

/* ===================== Kartenvorlage ===================== */
function cardTemplate(entry, opts){
  opts = opts || {};
  const editable = !!opts.editable;
  const kategorie = entry.kategorie || 'Einleuchten';
  const katClass = kategorie === 'Aufbau' ? 'kat-aufbau' : 'kat-einleuchten';
  let html = '<div class="card '+katClass+'" data-id="'+entry.id+'">';
  html += '<div class="cat-badge '+katClass+'">'+escapeHtml(kategorie)+'</div>';
  const imgCount = (entry.bild1?1:0) + (entry.bild2?1:0);
  html += '<div class="card-images count-'+(imgCount||1)+'">';
  if(entry.bild1){
    html += '<div class="img-wrap"><img src="'+entry.bild1+'" loading="lazy" onclick="openGalleryLightbox(\''+entry.id+'\',1)">';
    if(editable){ html += '<button class="img-del" onclick="event.stopPropagation();deleteEntryImage(\''+entry.id+'\',1)">🗑</button>'; }
    html += '</div>';
  }
  if(entry.bild2){
    html += '<div class="img-wrap"><img src="'+entry.bild2+'" loading="lazy" onclick="openGalleryLightbox(\''+entry.id+'\',2)">';
    if(editable){ html += '<button class="img-del" onclick="event.stopPropagation();deleteEntryImage(\''+entry.id+'\',2)">🗑</button>'; }
    html += '</div>';
  }
  if(!entry.bild1 && !entry.bild2){ html += '<div class="img-wrap"><span style="color:#999;font-size:12px;">Kein Bild</span></div>'; }
  html += '</div>';
  html += '<table class="card-footer"><tr>';
  html += '<td><b>Kreis</b>'+escapeHtml(entry.kreis||'–')+'</td>';
  html += '<td><b>Filter</b>'+escapeHtml(entry.filter||'–')+'</td>';
  html += '<td><b>Adresse</b>'+escapeHtml(entry.adresse||'–')+'</td>';
  html += '</tr>';
  if(entry.gruppe || entry.bemerkung){
    html += '<tr><td><b>Gruppe</b>'+escapeHtml(entry.gruppe||'–')+'</td>';
    html += '<td colspan="2"><b>Bemerkung</b>'+esc(entry.bemerkung||'–')+'</td></tr>';
  }
  html += '</table>';
  if(editable){
    html += '<div class="card-editrow">';
    html += '<button class="btn-primary" onclick="editEntry(\''+entry.id+'\')">✏️ Bearbeiten</button>';
    html += '<button onclick="shareEntry(\''+entry.id+'\')">📤 Teilen</button>';
    html += '<button class="btn-danger" onclick="deleteEntry(\''+entry.id+'\')">🗑️</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renameShow(){
  const show = loadShows().find(s=>s.id===state.showId);
  if(!show) return;
  const name = prompt('Titel der Veranstaltung / des Stücks:', show.name);
  if(name === null) return;
  const date = prompt('Datum / Info (optional):', show.date || '');
  if(date === null) return;
  const shows = loadShows();
  const idx = shows.findIndex(s=>s.id===show.id);
  if(idx >= 0){
    shows[idx].name = name.trim() || shows[idx].name;
    shows[idx].date = date.trim();
    saveShows(shows);
    markShowDirty(show.id);
  }
  renderApp();
}

function setMode(m){
  state.mode = m;

  renderApp();

function setCategory(c){ state.categoryFilter = c; renderApp(); }
function setSort(v){ state.sortMode = v; renderApp(); }
function kreisSortValue(k){
  const m = (k||'').match(/\d+/);
  return m ? parseInt(m[0], 10) : -1;
}
function kategorieRank(e){ return (e.kategorie||'Einleuchten') === 'Aufbau' ? 0 : 1; }
function sortEntries(entries){
  const mode = state.sortMode || 'standard';
  if(mode === 'standard'){
    // Grundsätzlich: erst alle Aufbau-Kreise, dann alle Einleuchten-Kreise,
    // innerhalb jeder Gruppe Kreisnummer klein → groß.
    return entries.slice().sort((a,b)=>
      kategorieRank(a) - kategorieRank(b) ||
      kreisSortValue(a.kreis) - kreisSortValue(b.kreis) ||
      (a.createdAt - b.createdAt)
    );
  }
  if(mode === 'kreis-asc'){
    return entries.slice().sort((a,b)=> kreisSortValue(a.kreis)-kreisSortValue(b.kreis) || (a.createdAt-b.createdAt));
  }
  if(mode === 'kreis-desc'){
    return entries.slice().sort((a,b)=> kreisSortValue(b.kreis)-kreisSortValue(a.kreis) || (a.createdAt-b.createdAt));
  }
  return entries.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}

/* ===================== PDF-Erzeugung (reines JS, ohne externe Bibliotheken) ===================== */
/* Baut eine echte PDF 1.4-Datei von Hand: A4-Seiten, eingebettete JPEGs (DCTDecode),
   Text mit Helvetica/WinAnsiEncoding. Keine Bibliothek nötig, da JPEG-Bytes 1:1 als
   Bild-XObject eingebettet werden können. */

function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return bytes;
}
function strToLatin1Bytes(str){
  const arr = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++){ arr[i] = str.charCodeAt(i) & 0xFF; }
  return arr;
}
function sanitizePdfText(str){
  if(!str) return '';
  return String(str)
    .replace(/[–—]/g,'-')
    .replace(/[„“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/…/g,'...')
    .replace(/[^\x00-\xFF]/g,'?');
}
function pdfEscape(str){
  return str.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function measureTextWidth(str, size){
  return str.length * size * 0.5; // grobe, aber für Umbruch/Zentrierung ausreichende Näherung
}
function wrapPdfText(str, maxWidth, size){
  const words = String(str).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(measureTextWidth(test, size) > maxWidth && cur){ lines.push(cur); cur = w; }
    else { cur = test; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function getJpegDimensions(bytes){
  let i = 2;
  while(i < bytes.length - 8){
    if(bytes[i] !== 0xFF){ i++; continue; }
    const marker = bytes[i+1];
    if(marker === 0xD8 || marker === 0x01 || (marker >= 0xD0 && marker <= 0xD7)){ i += 2; continue; }
    if(marker === 0xD9) break;
    const len = (bytes[i+2] << 8) | bytes[i+3];
    if(marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC){
      return { height: (bytes[i+5]<<8)|bytes[i+6], width: (bytes[i+7]<<8)|bytes[i+8] };
    }
    i += 2 + len;
  }
  return { width: 1000, height: 1000 };
}
function pdfTextOp(str, x, y, size, color, maxWidth, align){
  str = sanitizePdfText(str);
  if(align === 'center' && maxWidth){
    const w = measureTextWidth(str, size);
    x = x + Math.max(0, (maxWidth - w) / 2);
  }
  const c = color || [0,0,0];
  return 'BT '+c[0]+' '+c[1]+' '+c[2]+' rg /F1 '+size+' Tf '+x.toFixed(2)+' '+y.toFixed(2)+' Td ('+pdfEscape(str)+') Tj ET\n';
}
const KAT_COLOR = { 'Aufbau':[0.055,0.647,0.914], 'Einleuchten':[0.961,0.647,0.141] };

function buildShowPDFBlob(entries, headerText){
  const pageW = 595.28, pageH = 841.89; // A4 in pt
  const margin = 22.68; // ~8mm
  const contentW = pageW - margin*2;

  let nextId = 4; // 1=Catalog, 2=Pages, 3=Font
  const pages = entries.map(e=>{
    const pageId = nextId++, contentId = nextId++;
    let img1Id=null, img2Id=null, img1Bytes=null, img2Bytes=null, img1Dim=null, img2Dim=null;
    if(e.bild1){ img1Bytes = dataUrlToBytes(e.bild1); img1Dim = getJpegDimensions(img1Bytes); img1Id = nextId++; }
    if(e.bild2){ img2Bytes = dataUrlToBytes(e.bild2); img2Dim = getJpegDimensions(img2Bytes); img2Id = nextId++; }
    return { entry:e, pageId, contentId, img1Id, img2Id, img1Bytes, img2Bytes, img1Dim, img2Dim };
  });

  const pageContents = pages.map(p=>{
    const e = p.entry;
    const kategorie = e.kategorie || 'Einleuchten';
    const katColor = KAT_COLOR[kategorie] || KAT_COLOR['Einleuchten'];
    let y = pageH - margin;
    let ops = '';

    if(headerText){
      ops += pdfTextOp(headerText, margin, y-9, 9, [0.45,0.45,0.45], contentW, 'center');
      y -= 9*1.7;
    }
    const badgeW = 78, badgeH = 16;
    ops += 'q '+katColor[0]+' '+katColor[1]+' '+katColor[2]+' rg '+margin.toFixed(2)+' '+(y-badgeH).toFixed(2)+' '+badgeW+' '+badgeH+' re f Q\n';
    ops += pdfTextOp(kategorie, margin+7, y-badgeH+5, 8.5, [1,1,1]);
    y -= badgeH + 12;

    const imgCount = (p.img1Id?1:0) + (p.img2Id?1:0);
    if(imgCount === 1){
      const sz = Math.max(140, Math.min(contentW, y - margin - 95, 470));
      const x = margin + (contentW - sz)/2;
      const imgY = y - sz;
      ops += 'q '+sz.toFixed(2)+' 0 0 '+sz.toFixed(2)+' '+x.toFixed(2)+' '+imgY.toFixed(2)+' cm /Im1 Do Q\n';
      y = imgY - 14;
    } else if(imgCount === 2){
      const sz = Math.min(contentW, 300);
      const gap = 12;
      const x = margin + (contentW - sz)/2;
      let imgY = y - sz;
      ops += 'q '+sz.toFixed(2)+' 0 0 '+sz.toFixed(2)+' '+x.toFixed(2)+' '+imgY.toFixed(2)+' cm /Im1 Do Q\n';
      imgY -= (sz + gap);
      ops += 'q '+sz.toFixed(2)+' 0 0 '+sz.toFixed(2)+' '+x.toFixed(2)+' '+imgY.toFixed(2)+' cm /Im2 Do Q\n';
      y = imgY - 14;
    }

    const line1 = 'Kreis: '+(e.kreis||'-')+'    Filter: '+(e.filter||'-')+'    Adresse: '+(e.adresse||'-');
    wrapPdfText(line1, contentW, 10.5).forEach(l=>{ ops += pdfTextOp(l, margin, y, 10.5, [0,0,0]); y -= 15; });
    if(e.gruppe || e.bemerkung){
      const line2 = 'Gruppe: '+(e.gruppe||'-')+'    Bemerkung: '+(e.bemerkung||'-');
      wrapPdfText(line2, contentW, 10.5).forEach(l=>{ ops += pdfTextOp(l, margin, y, 10.5, [0,0,0]); y -= 15; });
    }
    return ops;
  });

  const chunks = [];
  let offset = 0;
  const xref = {};
  function put(part){
    const bytes = (typeof part === 'string') ? strToLatin1Bytes(part) : part;
    chunks.push(bytes);
    offset += bytes.length;
  }
  function beginObj(id){ xref[id] = offset; put(id+' 0 obj\n'); }
  function endObj(){ put('endobj\n'); }

  put('%PDF-1.4\n');
  beginObj(1); put('<< /Type /Catalog /Pages 2 0 R >>\n'); endObj();
  const kids = pages.map(p=>p.pageId+' 0 R').join(' ');
  beginObj(2); put('<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>\n'); endObj();
  beginObj(3); put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n'); endObj();

  pages.forEach((p,i)=>{
    const resXObj = [];
    if(p.img1Id) resXObj.push('/Im1 '+p.img1Id+' 0 R');
    if(p.img2Id) resXObj.push('/Im2 '+p.img2Id+' 0 R');
    const resources = '<< /Font << /F1 3 0 R >>'+(resXObj.length? ' /XObject << '+resXObj.join(' ')+' >>':'')+' >>';

    beginObj(p.pageId);
    put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageW+' '+pageH+'] /Resources '+resources+' /Contents '+p.contentId+' 0 R >>\n');
    endObj();

    const contentBytes = strToLatin1Bytes(pageContents[i]);
    beginObj(p.contentId);
    put('<< /Length '+contentBytes.length+' >>\nstream\n');
    put(contentBytes);
    put('\nendstream\n');
    endObj();

    if(p.img1Id){
      beginObj(p.img1Id);
      put('<< /Type /XObject /Subtype /Image /Width '+p.img1Dim.width+' /Height '+p.img1Dim.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.img1Bytes.length+' >>\nstream\n');
      put(p.img1Bytes);
      put('\nendstream\n');
      endObj();
    }
    if(p.img2Id){
      beginObj(p.img2Id);
      put('<< /Type /XObject /Subtype /Image /Width '+p.img2Dim.width+' /Height '+p.img2Dim.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.img2Bytes.length+' >>\nstream\n');
      put(p.img2Bytes);
      put('\nendstream\n');
      endObj();
    }
  });

  const xrefStart = offset;
  const maxId = nextId - 1;
  let xrefStr = 'xref\n0 '+(maxId+1)+'\n0000000000 65535 f \n';
  for(let id=1; id<=maxId; id++){
    const off = xref[id] !== undefined ? xref[id] : 0;
    xrefStr += String(off).padStart(10,'0')+' 00000 n \n';
  }
  put(xrefStr);
  put('trailer\n<< /Size '+(maxId+1)+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');

  return new Blob(chunks, { type:'application/pdf' });
}

function downloadOrOpenBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}
function pdfFilenameFor(show){
  const base = (show.name || 'Lichtdoku').replace(/[^a-z0-9]+/gi,'_');
  const suffix = (state.categoryFilter && state.categoryFilter !== 'Alle') ? '_'+state.categoryFilter : '';
  return base + suffix + '.pdf';
}

/* ===================== PDF-Export & Teilen ===================== */
function exportPDF(){
  const show = loadShows().find(s=>s.id===state.showId);
  const entries = getVisibleEntries(show);
  if(entries.length === 0){ toast('Keine Einträge zum Exportieren'); return; }
  const headerText = show.name + (state.categoryFilter && state.categoryFilter !== 'Alle' ? ' – '+state.categoryFilter : '');
  let blob;
  try{ blob = buildShowPDFBlob(entries, headerText); }
  catch(err){ console.error(err); toast('PDF-Erstellung fehlgeschlagen'); return; }
  // Direkter, synchroner Aufruf (kein await/setTimeout davor) – auf iOS öffnet sich
  // die PDF-Datei im eingebauten PDF-Viewer (mit Teilen/Sichern-Button oben),
  // auf dem Desktop wird sie direkt heruntergeladen.
  downloadOrOpenBlob(blob, pdfFilenameFor(show));
}

async function sharePDF(){
  const show = loadShows().find(s=>s.id===state.showId);
  const entries = getVisibleEntries(show);
  if(entries.length === 0){ toast('Keine Einträge zum Teilen'); return; }
  const headerText = show.name + (state.categoryFilter && state.categoryFilter !== 'Alle' ? ' – '+state.categoryFilter : '');
  let blob;
  try{ blob = buildShowPDFBlob(entries, headerText); }
  catch(err){ console.error(err); toast('PDF-Erstellung fehlgeschlagen'); return; }
  const filename = pdfFilenameFor(show);
  const file = new File([blob], filename, { type:'application/pdf' });
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: show.name });
      return;
    }
  }catch(err){ return; } // Nutzer hat Teilen abgebrochen
  // Fallback: PDF öffnen, von dort aus manuell teilen/sichern
  downloadOrOpenBlob(blob, filename);
}

/* ===================== Einzelnes Foto teilen ===================== */
function dataURLtoFile(dataurl, filename){
  const arr = dataurl.split(',');
  const mimeMatch = arr[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], filename, {type:mime});
}

async function shareEntry(id){
  const entries = loadEntries(state.showId);
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  const text = 'Kreis: '+(e.kreis||'-')+'\nFilter: '+(e.filter||'-')+'\nBemerkung: '+(e.bemerkung||'-');
  const files = [];
  if(e.bild1) files.push(dataURLtoFile(e.bild1, 'kreis_'+(e.kreis||'x')+'_1.jpg'));
  if(e.bild2) files.push(dataURLtoFile(e.bild2, 'kreis_'+(e.kreis||'x')+'_2.jpg'));
  try{
    if(navigator.canShare && files.length && navigator.canShare({files})){
      await navigator.share({files:files, title:'Lichtdoku – Kreis '+e.kreis, text:text});
    } else if(navigator.share){
      await navigator.share({title:'Lichtdoku – Kreis '+e.kreis, text:text});
    } else {
      await navigator.clipboard.writeText(text);
      toast('Kein Teilen verfügbar – Text kopiert');
    }
  }catch(err){ /* Nutzer hat Teilen abgebrochen */ }
}

function exportJSON(){
  const show = loadShows().find(s=>s.id===state.showId);
  const entries = loadEntries(state.showId);
  const blob = new Blob([JSON.stringify({show:show, entries:entries}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (show.name||'lichtdoku').replace(/[^a-z0-9]+/gi,'_') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
